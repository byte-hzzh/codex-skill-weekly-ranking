name: Collect and rank

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: skill-ranking-collector
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - id: collection
        name: Collect public data and finalize completed week when applicable
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN }}
        run: skill-ranker --root . run-daily
      - name: Validate generated artifacts
        run: skill-ranker --root . validate
      - if: steps.collection.outcome == 'failure'
        name: Report preserved stale publication
        run: echo "::warning::Collection failed; publishing the validated stale view of the last successful ranking."
      - uses: actions/upload-artifact@v4
        with:
          name: generated-ranking
          path: |
            README.md
            data
            docs
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: collect
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-ranking
          path: .
      - name: Commit validated generated changes
        run: |
          git add -- README.md data docs
          if git diff --cached --quiet -- README.md data docs; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh skill ranking" -- README.md data docs
          git push
